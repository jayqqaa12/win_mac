name: build

on:
  push:
    branches: [ "main" ]
    tags: [ "v*" ]
  pull_request:
  workflow_dispatch:

env:
  DOTNET_NOLOGO: true
  DOTNET_CLI_TELEMETRY_OPTOUT: true

jobs:
  build:
    name: Build (WinUI 3 · Self-contained x64)
    runs-on: windows-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-dotnet@v4
        with:
          dotnet-version: "8.0.x"

      - name: Restore
        run: dotnet restore WinMac.sln -p:Platform=x64

      - name: Build
        run: dotnet build WinMac.sln -c Release -p:Platform=x64 --no-restore

      - name: Publish (unpackaged · self-contained)
        run: dotnet publish src\WinMac.Shell\WinMac.Shell.csproj -c Release -p:Platform=x64 -r win-x64 --self-contained true -o publish -p:WindowsAppSDKSelfContained=true -p:WindowsPackageType=None

      - name: Build native MacTypeHook DLL (CMake / MSVC x64)
        shell: pwsh
        run: |
          cmake -S src\Native\MacTypeHook -B src\Native\MacTypeHook\build -A x64
          cmake --build src\Native\MacTypeHook\build --config Release
          Copy-Item src\Native\MacTypeHook\build\Release\MacTypeHook.dll publish\MacTypeHook.dll

      - name: Publish font-hook installer (framework-dependent)
        run: dotnet publish src\WinMac.Setup.Installer\WinMac.Setup.Installer.csproj -c Release -p:Platform=x64 -o publish-installer

      - name: Merge installer + hook DLL into artifact
        shell: pwsh
        run: |
          Copy-Item publish-installer\WinMac.Setup.Installer.exe publish\
          Copy-Item src\Native\MacTypeHook\build\Release\MacTypeHook.dll publish\MacTypeHook.dll -Force

      - name: Compress artifact
        shell: pwsh
        run: Compress-Archive -Path publish\* -DestinationPath WinMac-x64.zip

      - uses: actions/upload-artifact@v4
        with:
          name: WinMac-x64
          path: WinMac-x64.zip
          if-no-files-found: error

  release:
    name: Release (tag only)
    if: startsWith(github.ref, 'refs/tags/v')
    needs: build
    runs-on: ubuntu-latest
    permissions:
      contents: write
    steps:
      - uses: actions/download-artifact@v4
        with:
          name: WinMac-x64
          path: dist

      - uses: softprops/action-gh-release@v2
        with:
          files: dist/WinMac-x64.zip
          generate_release_notes: true